<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iris · Interactive Walls</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#050608}canvas{display:block}</style>
<!-- Offline: sw.js keeps a copy of this and every other file in the browser after the first start -->
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
</head>
<body>
<!-- always the newest sketch when online: its address changes on every start, so no cache can keep an old one
     (offline, sw.js gives its kept copy) -->
<script>document.write('<script src="sketch.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
